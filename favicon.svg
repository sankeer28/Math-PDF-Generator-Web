<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Math PDF Generator">
  <!--
    A sigma, drawn as a stroked path rather than as <text>: a glyph's position
    depends on font metrics, so it cannot be centred reliably and disappears on
    machines without that font. The extremes here are x 16-48 and y 12-52, so
    the mark is centred on (32, 32) by construction.

    Graphite rather than a colour: the interface spends its one colour on the
    Download button. A mid-tone keeps the mark legible on both a light and a
    dark ground, since this file serves the browser tab and the app bar.
  -->
  <path d="M48 12 H16 L34 32 L16 52 H48"
        fill="none" stroke="#33302a" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
